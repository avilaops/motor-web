[package]
name = "motor-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Regras de conteúdo da Ávila Ops: validação, cabeçalho, JSON-LD, mídia, sitemaps, robots.txt e llms.txt"
repository = "https://github.com/avilaops/motor-web"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "avif"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = { version = "0.11.0", optional = true }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
webp = { version = "0.3.1", default-features = false, optional = true }

[features]
default = []
# Gera as variantes AVIF e WebP. Fica fora do padrão para quem só valida e
# gera texto não compilar codificador de imagem.
imagem = ["dep:image", "dep:webp", "dep:sha2"]

[dev-dependencies]
insta = "1.49.0"
proptest = "1.11.0"

# O codificador AVIF sem otimização leva minutos por imagem nos testes.
[profile.dev.package."*"]
opt-level = 2
