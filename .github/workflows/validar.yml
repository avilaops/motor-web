name: Validar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Referência não é regravada no CI: saída diferente falha o teste.
      INSTA_UPDATE: "no"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      # Quem só valida compila sem os codificadores de imagem.
      - name: Testes sem a feature de imagem
        run: cargo test
      - name: Testes com todas as features
        run: cargo test --all-features
